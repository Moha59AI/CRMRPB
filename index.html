<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relais Pare-Brise — CRM</title>
    <meta name="description" content="CRM de gestion des leads, interventions et clients Relais Pare-Brise." />
    <!-- Outil interne : rien a indexer ni a partager. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16A34A" />

    <!-- Installation sur l'ecran d'accueil. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS ignore le manifeste : ces deux balises lui disent la meme chose. -->
    <!-- `apple-mobile-web-app-capable` est deprecie mais reste lu par les
         anciennes versions d'iOS ; le nom standard le remplace ailleurs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Relais CRM" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
